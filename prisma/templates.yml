# Template definitions for OSM for Cities (logic only)
# Format: [id, query, category, icon, parent?]
# Composite queries: ; = OR, & = AND. Example: highway=footway;highway=path&surface=paved
# Template icons are Pinhead ids (file names at https://pinhead.ink) or prisma/custom-icons file names, required, validated by pnpm generate-icons.
# Category icons (categories section below) are Lucide icon names.

templates:
