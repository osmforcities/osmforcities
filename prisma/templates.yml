# Per-template filterable-tag allow-list.
# Curated OSM tag keys that become interactive-legend views for a template.
# Templates absent here show the age ("Recent edits") view only.
# Add tag-key labels to messages/*.json (TagLabel) and controlled values (TagValue).
# Tuning process (widen/reduce from the dashboard): docs/features/template-management.md.
filterableTags:
  bus-stops:       [shelter, bench, lit, tactile_paving, wheelchair, operator]
  bicycle-parking: [bicycle_parking, covered, capacity, access, fee]
  bicycle-rental:  [bicycle_rental, operator, network, capacity]
  ev-charging:     [capacity, operator, access, fee]
  crossings:       [crossing, crossing:markings, tactile_paving, traffic_signals:sound]
  railway-stations: [station, wheelchair, operator, network]
  social-facility:  [social_facility, social_facility:for, operator, wheelchair]
  community-centre: [community_centre, operator]
  town-halls:       [building, wheelchair, townhall:type]
  senior-centers:   [social_facility, operator, wheelchair]
  transit-platforms: [tactile_paving, wheelchair, shelter, bench, lit]
  subway-entrances: [wheelchair]
  taxi-ranks:       [capacity, operator]
  ferry-terminals:  [operator, network, wheelchair]
  parking:          [parking, access, fee, capacity, surface]
  rail-tracks:      [railway, electrified, usage, service]
  busways:          [surface]
  roads:            [surface, maxspeed, lit, sidewalk]
  footways:         [surface, lit, smoothness]
  cycleways:        [surface, lit, oneway, smoothness]
  traffic-calming:  [traffic_calming]
  speed-cameras:    [maxspeed]
  schools:          [operator, operator:type, wheelchair, isced:level]
  universities:     [operator, operator:type, wheelchair]
  libraries:        [operator, operator:type, wheelchair, internet_access]
  kindergarten:     [operator, operator:type, wheelchair]
  college:          [operator, operator:type, wheelchair]
  childcare:          [operator, operator:type, wheelchair]
  driving-school:     [operator, wheelchair]
  music-school:       [operator, operator:type, wheelchair]
  language-school:    [operator, operator:type, wheelchair]
  research-institute: [operator, operator:type, wheelchair]

