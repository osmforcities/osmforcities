# Template definitions for OSM for Cities (logic only)
# Format: [id, query, category, icon?, parent?]
# Composite queries: ; = OR, & = AND. Example: highway=footway;highway=path&surface=paved
# Icons are Lucide icon names, validated by pnpm generate-icons.
# Templates without an icon fall back to their category icon (categories section below).

templates:
# Transportation
  - ["bicycle-parking","amenity=bicycle_parking","transport","Bike"]
  - ["bicycle-rental","amenity=bicycle_rental","transport","Bike"]
  # Parent template for public transit
  - ["public-transit","highway=bus_stop;railway=station;railway=tram_stop;railway=subway_entrance;public_transport=platform","transport","Train"]
  - ["bus-stops","highway=bus_stop","transport","Bus","public-transit"]
