# The area hub's "Common datasets" grid, in this order. Sync fails on a missing
# or deprecated id. Picked for good OSM coverage worldwide; keep it at 12 so the
# 2- and 3-column grid fills evenly.
commonTemplates:
  - bus-stops
  - roads
  - footways
  - schools
  - hospitals
  - pharmacies
  - parks
  - playgrounds
  - buildings
  - supermarkets
  - restaurants
  - places-of-worship

# Replacements for removed templates (old-id: new-id).
# The old id leaves the templates list above and deprecates as usual; its report
# email links the replacement and its dataset URLs redirect to it. Sync fails if
# the old id is still listed or the new id is missing or deprecated.
replacedBy:
  agricultural-buildings: farm-auxiliary
  feedlots: farmyards
  stockyards: farmyards
  poultry-yards: farmyards
  dairy-yards: farmyards
  cowsheds: livestock-buildings
  pig-sties: livestock-buildings
  stables: livestock-buildings
  bunker-silos: silos
  slurry-basins: agricultural-tanks
  slurry-tanks: agricultural-tanks
  manure-storage: agricultural-tanks
  urban-trees: trees
  street-trees: trees
  trees-with-species: trees
  vegetation-risk-context: trees

