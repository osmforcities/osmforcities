name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
  push:
    branches: [main, develop]

# Prevent running the same workflow multiple times
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  playwright:
    if: github.event.pull_request.draft == false
    needs: checks
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2-shard matrix: each shard runs on its own runner with its own
        # Postgres service, halving wall-clock CI time. `shard` (1/2) drives
        # the Playwright --shard flag; `shard_id` (1-2) is a slash-free
        # identifier used for artifact names (upload-artifact rejects "/").
        include:
          - shard: 1/2
            shard_id: 1-2
          - shard: 2/2
            shard_id: 2-2
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: osmforcities-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@v4

      - name: Read .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Install Playwright Browsers
        run: pnpm playwright install chromium --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test --shard=${{ matrix.shard }}
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/osmforcities-test
          AUTH_SECRET: test-secret-for-ci-only
          AUTH_URL: http://localhost:3000
          CRON_ROUTE_SECRET: test-cron-secret
          ENABLE_TEST_AUTH: true
          NEXT_TELEMETRY_DISABLED: 1

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard_id }}
          path: playwright-report/
          retention-days: 30

  storybook-tests:
    if: github.event.pull_request.draft == false
    needs: checks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Install Playwright Browsers
        run: pnpm playwright install chromium --with-deps

      - name: Run Storybook tests
        run: pnpm test-storybook
