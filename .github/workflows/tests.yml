name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
  push:
    branches: [main, develop]

# Prevent running the same workflow multiple times
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  playwright:
    # No `needs: checks`: e2e is the long pole, so it starts right away
    # instead of waiting ~1.5 min for lint/types/build
    if: github.event.pull_request.draft == false
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each job runs on its own runner with its own Postgres.
        # Shards split by test count, not duration, so the slow tiler specs
        # get a job of their own instead of piling onto the last shard.
        include:
          - { project: chromium, shard: 1/3 }
          - { project: chromium, shard: 2/3 }
          - { project: chromium, shard: 3/3 }
          - { project: tiler, shard: 1/1 }
    steps:
      - uses: actions/checkout@v4

      # The runner image ships PostgreSQL (disabled by default): starting it
      # skips the Docker Hub pull a service container needs. global-setup
      # creates the database.
      - name: Start PostgreSQL
        run: |
          sudo sed -i 's/^port = .*/port = 5433/' /etc/postgresql/*/main/postgresql.conf
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5433; do sleep 1; done
          sudo -u postgres psql -p 5433 -c "ALTER USER postgres PASSWORD 'postgres'"

      - name: Read .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Install Playwright Browsers
        run: pnpm playwright install chromium --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          E2E_PROJECT: ${{ matrix.project }}
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/osmforcities-test
          AUTH_SECRET: test-secret-for-ci-only
          AUTH_URL: http://localhost:3000
          CRON_ROUTE_SECRET: test-cron-secret
          ENABLE_TEST_AUTH: true
          NEXT_TELEMETRY_DISABLED: 1

      # Screenshots and traces of failed attempts, flaky ones included
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  storybook-tests:
    if: github.event.pull_request.draft == false
    needs: checks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Install Playwright Browsers
        run: pnpm playwright install chromium --with-deps

      - name: Run Storybook tests
        run: pnpm test-storybook
